<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Pune Furnitures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  padding: 32px 24px;
}
.error-card {
  max-width: 480px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: clamp(32px, 6vw, 48px);
  box-shadow: var(--card-sh-h);
}
.error-num {
  font: 700 4.5rem/1 var(--disp);
  color: var(--at);
  margin-bottom: 12px;
}
.error-card h1 {
  font-size: 1.8rem;
  margin-bottom: 12px;
}
.error-card p {
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 28px;
}
</style>
</head>
<body>
<main class="error-card">
  <div class="error-num">404</div>
  <h1>Page Not Found</h1>
  <p>The page you are looking for has moved or does not exist. Head back to explore our custom furniture collections.</p>
  <a class="btn primary" href="index.html">Return to Home</a>
</main>
</body>
</html>
